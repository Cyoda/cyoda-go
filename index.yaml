apiVersion: v1
entries:
  cyoda:
  - annotations:
      artifacthub.io/changes: |
        - terminationGracePeriodSeconds defaults to 390, so a node can finish its scheduled runs before it is killed
        - Removed the `bootstrap.*` values and the bootstrap Secret; the first admin token comes from `cyoda token` (see NOTES)
        - `jwt.expirySeconds` defaults to 300 and is capped at 3600 (1 hour), the largest value the server accepts
        - `jwt.issuer` must not be empty; the server refuses to start with an empty issuer
        - The NOTES and README examples keep secrets off the command line: the metrics bearer goes on stdin, and Secrets are created from private files
        - With `gateway.enabled=true` (the default), an empty, null or missing `gateway.parentRefs`, or an entry with no `name`, fails the install; it used to render routes attached to no Gateway. Set `gateway.parentRefs`, or `gateway.enabled=false`
    apiVersion: v2
    appVersion: 0.9.1
    created: "2026-11-25T16:26:26.161897661Z"
    description: 'cyoda-go: a lightweight, multi-node Go digital twin of the Cyoda
      platform. This chart ships a production-ready Helm deployment backed by an external
      Postgres, fronted by Gateway API (default) or a still-maintained Ingress controller
      (transitional). '
