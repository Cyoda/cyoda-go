apiVersion: v2
name: cyoda
description: |
  cyoda-go: a lightweight, multi-node Go digital twin of the Cyoda platform.
  This chart ships a production-ready Helm deployment backed by an external
  Postgres, fronted by Gateway API (default) or a still-maintained Ingress
  controller (transitional).
type: application
version: 0.9.0
appVersion: "0.8.4" # bump-chart-appversion.yml syncs this to the binary
kubeVersion: ">=1.31.0"
keywords:
  - cyoda
  - digital-twin
  - workflow
home: https://github.com/cyoda/cyoda-go
sources:
  - https://github.com/cyoda/cyoda-go
maintainers:
  - name: Cyoda Platform
    url: https://github.com/cyoda
annotations:
  artifacthub.io/changes: |
    - terminationGracePeriodSeconds defaults to 390, so a node can finish its scheduled runs before it is killed
    - Removed the `bootstrap.*` values and the bootstrap Secret; the first admin token comes from `cyoda token` (see NOTES)
    - `jwt.expirySeconds` is capped at 31622400 (366 days), the largest value the server accepts
    - `jwt.issuer` must not be empty; the server refuses to start with an empty issuer
    - The NOTES and README metrics example pass the bearer token on stdin, off the command line
