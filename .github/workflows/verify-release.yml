name: Verify release

# Installs the published release the way users do — install.sh with
# signatures required, the .deb and .rpm, the signed image by digest,
# Homebrew, the Helm repository — and checks that GitHub's Latest release and
# every /releases/latest/download/ URL give it. A release can pass every
# build-time check and still be broken where users meet it; this is where
# that shows.
on:
  workflow_run:
    workflows: ["Release", "Release chart"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z). Empty: GitHub's Latest release."
        required: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      flags: ${{ steps.r.outputs.flags }}
      stable: ${{ steps.r.outputs.stable }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          flags="--chart"
          case "$EVENT" in
            workflow_run)
              case "$RUN_NAME" in
                # The chart release comes after the binary release: check
                # the binary only; the chart run checks the chart.
                Release) tag="$RUN_REF"; flags="" ;;
                "Release chart") tag="v${RUN_REF#cyoda-}" ;;
                *) echo "unexpected workflow '$RUN_NAME'"; exit 1 ;;
              esac ;;
            *) tag="${INPUT_TAG:-$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)}" ;;
          esac
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) : ;; *) echo "not a release tag: '$tag'"; exit 1 ;; esac
          stable=true
          case "$tag" in *-*) stable=false ;; esac
          # A stable release must be GitHub's Latest; a pre-release never is.
          [ "$stable" = true ] && flags="$flags --latest"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "Verifying $tag with: ${flags:-(pinned checks only)}"

  linux:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.1.4
      - name: verify-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          FLAGS: ${{ needs.resolve.outputs.flags }}
        run: scripts/verify-release.sh "$TAG" $FLAGS

  homebrew:
    needs: resolve
    # The tap is updated for stable releases only.
    if: needs.resolve.outputs.stable == 'true'
    runs-on: macos-latest
    steps:
      - name: brew install from the tap gives the release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          brew install cyoda/cyoda-go/cyoda
          cyoda --version
          cyoda --version | grep -q "^cyoda version ${TAG#v} "
