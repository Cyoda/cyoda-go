openapi: 3.1.0
info:
  title: Fixture API
  version: 0.0.1
paths:
  /events:
    get:
      operationId: getEvents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Base'
components:
  schemas:
    Base:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
            - PENDING
      discriminator:
        propertyName: kind
        mapping:
          alpha: '#/components/schemas/Alpha'
          beta: '#/components/schemas/Beta'
    Alpha:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            alphaField:
              type: string
    Beta:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            betaField:
              type: string
